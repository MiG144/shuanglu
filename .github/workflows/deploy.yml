# ===========================================================================
# 双陆棋 · GitHub Actions：构建 + 部署到 GitHub Pages
#
# 触发：push 到 main 分支时自动构建，发布为 Pages 站点（在线试玩 URL）。
# 首次启用步骤（仓库管理员）：
#   仓库 Settings → Pages → Source 选择 "GitHub Actions"
#   之后每次 push 会自动部署到 https://<user>.github.io/<repo>/
# ===========================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4