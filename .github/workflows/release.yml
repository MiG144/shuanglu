# ===========================================================================
# 双陆棋 · Release：打 tag（v*）时构建离线单文件 exe 并发布到 GitHub Release
# 触发：push 标签 v1.0.0 / v0.2.0 等
# 产出：Release 附件 —— shuanglu.exe（单 exe；停止=主菜单按钮/关浏览器自动退出）
# ===========================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  build-sea:
    name: Build offline exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SEA executable
        run: node scripts/build-sea.mjs

      # 重命名为 ASCII（Release 资产标签兼容性）
      - name: Rename to ASCII
        shell: pwsh
        run: Copy-Item "dist-app/双陆棋.exe" dist-app/shuanglu.exe -Force

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: shuanglu-win-executable
          path: dist-app/shuanglu.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-sea
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: shuanglu-win-executable
          path: dist-app

      # 用 gh CLI 创建 Release 并上传资产（单 exe；停止=主菜单按钮/关闭浏览器自动退出）
      - name: Create Release and upload asset
        run: |
          gh release create "${{ github.ref_name }}" \
            dist-app/shuanglu.exe \
            --repo "${{ github.repository }}" \
            --title "双陆棋 ${{ github.ref_name }}" \
            --generate-notes