# ===========================================================================
# 双陆棋 · Release：打 tag（v*）时构建离线单文件 exe 并发布到 GitHub Release
# 触发：push 标签 v1.0.0 / v0.2.0 等
# 产出：dist-app/双陆棋.exe + 停止双陆棋.exe 附加到 Release 页面
# ===========================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许手动触发（用当前 commit 打 Release）

permissions:
  contents: write

jobs:
  build-sea:
    name: Build offline exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SEA executables
        run: node scripts/build-sea.mjs

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: shuanglu-win-executables
          path: |
            dist-app/双陆棋.exe
            dist-app/停止双陆棋.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-sea
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          name: shuanglu-win-executables
          path: dist-app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-app/双陆棋.exe
            dist-app/停止双陆棋.exe
          generate_release_notes: true
          name: 双陆棋 ${{ github.ref_name }}